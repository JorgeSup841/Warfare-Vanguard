
<nav class="pixel-nav" aria-label="Navegación de Aura Wars">

  <a class="brand" routerLink="/">
    ✚ AURA WARS
  </a>

  <div class="links">

    <a
      routerLink="/"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }">
      INICIO
    </a>

    <a
      *ngIf="auth.estaAutenticado()"
      routerLink="/panel"
      routerLinkActive="activo">
      CUARTEL
    </a>

    <a
      *ngIf="auth.estaAutenticado() && !auth.isAdmin()"
      routerLink="/partidas"
      routerLinkActive="activo">
      PARTIDAS
    </a>

    <a
      *ngIf="auth.isAdmin()"
      routerLink="/admin"
      routerLinkActive="activo">
      ADMIN
    </a>

    <a
      routerLink="/tablero-demo"
      routerLinkActive="activo">
      DEMO
    </a>

    <button
      *ngIf="auth.estaAutenticado()"
      type="button"
      (click)="salir()">
      SALIR
    </button>

    <span class="estado">
      {{ auth.estaAutenticado() ? 'EN LÍNEA' : 'SIN SESIÓN' }}
      <i></i>
    </span>

  </div>

</nav>
